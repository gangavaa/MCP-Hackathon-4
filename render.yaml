# Render Blueprint: Postgres, Keycloak, the REST backend, the Angular dashboard (a static site in front of the backend)
# and the MCP server. Render → New → Blueprint → this repo. Every push to main redeploys.
#
# Services reach each other by their public https URLs, which are https://<name>.onrender.com — if Render had to add a
# suffix to a name (it is taken), fix APP_URL / OIDC_ISSUER / NMS_API_URL / DASHBOARD_URL and the frontend's /api
# rewrite below in the Render dashboard to the URLs it shows. ${RENDER_EXTERNAL_URL} (a service's own URL, set by Render) and ${...} inside
# values are resolved by Spring at startup, not by Render.

databases:
  - name: nms-hack4-db
    plan: free
    databaseName: nms_dashboard
    user: nms

services:
  # Sign-in. Pre-built Keycloak with its own in-container store: the realm (clients, demo users) is re-imported on every
  # start. Fits the free 512 MB (~400 MB used); the heap is capped in keycloak/Dockerfile.
  - type: web
    name: nms-hack4-keycloak
    runtime: docker
    plan: free
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_URL # where users open the dashboard — the realm's redirect URIs and web origins
        value: https://nms-hack4-frontend.onrender.com
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

  # The Angular dashboard and the panel test host (/host), served from Render's CDN. /api is rewritten to the backend,
  # so the browser stays on one origin (no CORS) and the app's relative /api URLs work unchanged.
  - type: web
    name: nms-hack4-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build && cp dist/panel/index.html dist/dashboard/browser/panel.html
    staticPublishPath: dist/dashboard/browser
    envVars:
      - key: NODE_VERSION
        value: "22" # latest 22.x; the Angular CLI needs ≥ 22.22.3
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nms-hack4-app.onrender.com/api/*
      # Angular routes are client-side; Render applies a rewrite only when no file matches the path.
      - type: rewrite
        source: /*
        destination: /index.html

  # REST API (the dashboard is the frontend site above). Seeds the database on first start.
  - type: web
    name: nms-hack4-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "4300"
      - key: DATABASE_URL
        fromDatabase:
          name: nms-hack4-db
          property: connectionString
      - key: API_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: OIDC_ISSUER
        value: https://nms-hack4-keycloak.onrender.com/realms/nms
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70

  # Claude connects to https://nms-hack4-mcp.onrender.com/mcp.
  - type: web
    name: nms-hack4-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.mcp
    dockerContext: .
    envVars:
      - key: PORT
        value: "4301"
      - key: MCP_PORT
        value: "4301"
      - key: MCP_PUBLIC_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: NMS_API_URL
        value: https://nms-hack4-app.onrender.com
      - key: DASHBOARD_URL
        value: https://nms-hack4-frontend.onrender.com
      - key: OIDC_ISSUER
        value: https://nms-hack4-keycloak.onrender.com/realms/nms
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70
