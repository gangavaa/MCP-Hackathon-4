<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMS · Panel test host</title>
    <link rel="stylesheet" href="./host.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="logo"><span class="logo-mark">NMS</span> Panel test host</div>
      <div class="topbar-right">
        <label class="theme"><input id="dark" type="checkbox" /> Dark host</label>
        <a href="/" target="nms-dashboard">Open dashboard ↗</a>
      </div>
    </header>
    <main class="host">
      <aside class="side">
        <p class="note">
          Stands in for Claude Desktop: each question below is a <code>show_chart</code> call with the spec Claude
          would write, rendered through the real MCP Apps bridge. Drill-downs and pins go to the API.
        </p>
        <div id="questions" class="questions"></div>
        <h2>From the panel</h2>
        <ol id="log" class="log"></ol>
      </aside>
      <section class="chat">
        <div id="bubble" class="bubble" hidden></div>
        <div id="frame-slot"></div>
      </section>
    </main>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
